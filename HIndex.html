<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PinkAura Fashion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',Arial,sans-serif;
}

body{
    background:#fff5fa;
    color:#555;
}


/* NAVBAR */

header{
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 3px 15px #ddd;
}

.logo{
    font-size:30px;
    font-weight:bold;
    color:#ff4fa3;
}

nav a{
    text-decoration:none;
    color:#555;
    margin:0 15px;
}

nav a:hover{
    color:#ff4fa3;
}


/* HERO */

.hero{

    height:500px;
    background:
    linear-gradient(
    rgba(255,182,215,.8),
    rgba(255,240,248,.9)
    ),
    url("https://via.placeholder.com/1200x500");

    background-size:cover;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

}


.hero h1{

    font-size:50px;
    color:#d63384;

}


.hero p{

    font-size:20px;
    margin:20px;

}


.btn{

    background:#ff4fa3;
    color:white;
    padding:15px 35px;
    border-radius:30px;
    text-decoration:none;

}


/* SEARCH */

.search{

    padding:30px;
    text-align:center;

}


.search input{

    width:60%;
    padding:15px;
    border-radius:30px;
    border:2px solid #ffb6d9;

}



/* KATEGORI */

.kategori{

    padding:40px 8%;
    text-align:center;

}


.kategori-box{

    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;

}


.kategori-item{

    background:white;
    width:180px;
    padding:25px;
    border-radius:20px;

    box-shadow:0 5px 15px #ddd;

    color:#ff4fa3;

}



/* PRODUK */


.produk{

    padding:50px 8%;

}


.produk h2{

    text-align:center;
    color:#d63384;
    margin-bottom:40px;

}


.container{

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;

}
